<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel: 24V start/stop</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F5F5F0; color: #1B1B1B; font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: #fff; border-bottom: 1px solid #ddd; }
    header h1 { font-size: 18px; margin: 0 12px 0 0; }
    button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
    button.on { background: #1B1B1B; color: #fff; border-color: #1B1B1B; }
    button.mistake.on { background: #C62828; border-color: #C62828; }
    #label { font-weight: 600; }
    main { flex: 1; min-height: 0; position: relative; }
    /* Fill the screen (the source image is only 600 px wide, so max-width alone
       left it small in a sea of white and tiny in the glasses camera's view). */
    main img { position: absolute; inset: 8px 8px 64px; width: calc(100% - 16px); height: calc(100% - 72px); object-fit: contain; }
    .hint { color: #6B6B6B; font-size: 13px; margin-left: auto; }
    #verdict { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px; font-size: 22px; font-weight: 700;
               color: #fff; background: #333; display: none; }
    #verdict.pass { background: #1E7D32; } #verdict.fail { background: #C62828; } #verdict.warn { background: #B26A00; }
    #verdict.busy { background: #333; }
  </style>
</head>
<body>
  <header>
    <h1>24V start/stop circuit</h1>
    <div id="steps"></div>
    <button id="mistake" class="mistake" title="Leave out the 13-14 seal-in wiring">Planted mistake: no seal-in</button>
    <span id="label"></span>
    <span class="hint">← → step · M mistake · F fullscreen · Space = Check</span>
  </header>
  <main><img id="img" alt="Wiring diagram"></main>
  <div id="verdict"></div>
  <script src="config.js"></script>
  <script>
    // Same circuit as the seed procedure (commentary/guide/seed); the panel state
    // after each step, as the glasses camera should see it when the step is done.
    var TITLES = ['Mount parts on rail', 'Wire +24V to Stop', 'Link Stop to Start', 'Wire Start to coil',
                  'Wire coil to 0V', 'Wire the pilot light', 'Wire the seal-in contact', 'Tug-test every wire'];
    var step = 1, mistake = false;

    function render() {
      var bad = mistake && step >= 7;
      document.getElementById('img').src = 'panel/step' + step + (bad ? '_no_seal_in' : '') + '.jpg';
      document.getElementById('label').textContent = 'Step ' + step + ': ' + TITLES[step - 1] +
        (bad ? '  (seal-in left out)' : '');
      document.querySelectorAll('#steps button').forEach(function (b) {
        b.classList.toggle('on', +b.dataset.step === step);
      });
      document.getElementById('mistake').classList.toggle('on', mistake);
      history.replaceState(null, '', '#' + step + (mistake ? 'm' : ''));
    }

    var bar = document.getElementById('steps');
    TITLES.forEach(function (_, i) {
      var b = document.createElement('button');
      b.textContent = i + 1;
      b.dataset.step = i + 1;
      b.onclick = function () { step = i + 1; render(); };
      bar.appendChild(b);
    });
    document.getElementById('mistake').onclick = function () { mistake = !mistake; render(); };
    // Space = Check on the active guided run, so you keep looking at the panel
    // (the check judges frames taken after the press). The verdict shows below;
    // the guide window advances on a pass as usual.
    var checking = false;
    function banner(text, cls) {
      var v = document.getElementById('verdict');
      v.textContent = text;
      v.className = cls;
      v.style.display = 'block';
    }
    function check() {
      if (checking) return;
      var api = window.APP_CONFIG.guideApi;
      checking = true;
      banner('Checking… keep looking at the panel', 'busy');
      fetch(api + '/runs/active', { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('No guided run active. Start one in the guide window.'); return r.json(); })
        .then(function (run) { return fetch(api + '/runs/' + run.id + '/check', { method: 'POST' }); })
        .then(function (r) { if (!r.ok) throw new Error('Check failed (HTTP ' + r.status + ')'); return r.json(); })
        .then(function (run) {
          var a = run.last_attempt || {};
          var label = { pass: '✓ ', fail: '⚠ Not yet: ', unsure: '⚠ Look closer: ', hold_still: '⚠ Hold still: ', error: '⚠ ' }[a.verdict] || '';
          banner(label + (a.reason || '') + '  (step ' + (run.current_step + 1) + ' of ' + run.total_steps + ')',
                 a.verdict === 'pass' ? 'pass' : a.verdict === 'fail' ? 'fail' : 'warn');
          if (a.verdict === 'pass') {
            // Advance the run like the glasses app does; from_step makes it a no-op
            // if the guide window already did. Then show the next step's diagram.
            var from = run.current_step;
            setTimeout(function () {
              fetch(api + '/runs/' + run.id + '/next?from_step=' + from, { method: 'POST' })
                .then(function (r) { return r.json(); })
                .then(function (r) {
                  if (r.screen === 'done') { banner('✓ All steps done. Open the work record.', 'pass'); return; }
                  banner('Step ' + (r.current_step + 1) + ' of ' + r.total_steps + ': ' + ((r.step || {}).title || ''), 'busy');
                  if (!mistake) { step = Math.min(8, r.current_step + 1); render(); }
                });
            }, window.APP_CONFIG.passAdvanceMs);
          }
        })
        .catch(function (e) { banner('⚠ ' + e.message, 'warn'); })
        .then(function () { checking = false; });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === ' ') { e.preventDefault(); check(); return; }
      if (e.key === 'ArrowRight') step = Math.min(8, step + 1);
      else if (e.key === 'ArrowLeft') step = Math.max(1, step - 1);
      else if (e.key === 'm' || e.key === 'M') mistake = !mistake;
      else if (e.key === 'f' || e.key === 'F') document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      else return;
      render();
    });
    var h = /^#(\d)(m?)$/.exec(location.hash);
    if (h) { step = Math.min(8, Math.max(1, +h[1])); mistake = !!h[2]; }
    render();
  </script>
</body>
</html>
